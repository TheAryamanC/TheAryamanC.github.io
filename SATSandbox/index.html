<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>SAT Sandbox</title>
	<style>
		body {
			margin: 0;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: #fafafa;
			color: #222;
		}

		.todo-banner {
			background: #ffc107;
			color: #3d2f00;
			padding: 0.75rem 1rem;
			font-weight: 600;
			text-align: center;
			border-bottom: 1px solid #e0a800;
		}

		main {
			max-width: 60rem;
			margin: 0 auto;
			padding: 1.5rem 1rem;
		}

		h1 {
			font-size: 1.25rem;
			margin: 0 0 1rem;
		}

		pre {
			background: #fff;
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: 1rem;
			overflow-x: auto;
			white-space: pre-wrap;
			word-break: break-word;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.9rem;
			line-height: 1.4;
			min-height: 6rem;
		}

		.empty {
			color: #888;
			font-style: italic;
		}
	</style>
</head>
<body>
	<div class="todo-banner">Come back soon!</div>
	<main>
		<h1>SAT Sandbox</h1>
		<pre id="code" class="empty">Waiting for code&hellip;</pre>
	</main>

	<script>
		var codeElement = document.getElementById("code");

		window.addEventListener("message", function (e) {
			if (typeof e.data !== "string") return;
			codeElement.classList.remove("empty");
			codeElement.textContent = e.data;
		});

		// The opening page waits for a message from us before sending the code block.
		if (window.opener) {
			window.opener.postMessage("ready", "*");
		} else {
			codeElement.textContent = "Open this page by clicking a DemoSAT code block.";
		}
	</script>
</body>
</html>
